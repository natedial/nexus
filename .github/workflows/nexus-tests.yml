name: Nexus tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  research-parser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/research_parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/ -q

  research-relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/research-relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test deps
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/ -q --ignore=tests/test_alerts.py --ignore=tests/test_archive_health.py
