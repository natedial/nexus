[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-relay"
version = "1.0.0"
description = "Privacy-preserving Gmail to Proton Mail Bridge SMTP relay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "research-pipeline-ops>=0.1.0",
]

[tool.uv.sources]
research-pipeline-ops = { path = "../research_pipeline_ops", editable = true }

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
research-relay = "research_relay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
