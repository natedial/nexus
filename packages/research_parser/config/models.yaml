# Model Configuration for Research Parser
# ==========================================
# Change models on the fly by editing this file.
# No code changes required.

# Extraction Pipeline Steps
# Each step can use a different provider/model combination.

extraction:
    # Step 1: Strip boilerplate text (legal disclaimers, disclosures)
    # Recommended: deterministic stripper handles most documents; this model is
    # only used as fallback when deterministic rules cannot find the boilerplate.
    boilerplate:
        provider: openrouter
        model: qwen/qwen3-30b-a3b-instruct-2507
        max_tokens: 4096
        temperature: 0
        fallback:
            - provider: openrouter
              model: qwen/qwen3-235b-a22b-2507
              max_tokens: 4096
              temperature: 0

    # Step 2: Extract document metadata (source, date, region, etc.)
    # Recommended: cheap structured model with a non-free fallback. Avoid free
    # OpenRouter routes here because metadata gates every downstream step.
    metadata:
        provider: openrouter
        model: qwen/qwen3-30b-a3b-instruct-2507
        max_tokens: 2048
        temperature: 0
        fallback:
            - provider: openrouter
              model: qwen/qwen3-235b-a22b-2507
              max_tokens: 2048
              temperature: 0

    # Step 3: Extract key themes from document
    # Recommended: best quality model that stays under the current cost cap
    # (<= $0.20/M input and <= $0.30/M output on OpenRouter).
    themes:
        provider: openrouter
        model: qwen/qwen3-235b-a22b-2507
        max_tokens: 8192
        temperature: 0
        fallback:
            - provider: openrouter
              model: qwen/qwen3-30b-a3b-instruct-2507
              max_tokens: 8192
              temperature: 0

    # Step 4: Extract trade ideas and positions
    # Recommended: same high-quality structured model as themes; trade output is
    # small relative to document input and remains within the cost cap.
    trades:
        provider: openrouter
        model: qwen/qwen3-235b-a22b-2507
        max_tokens: 4096
        temperature: 0
        fallback:
            - provider: openrouter
              model: qwen/qwen3-30b-a3b-instruct-2507
              max_tokens: 4096
              temperature: 0

# Note: Synthesis (through-lines) is performed downstream by research_dispatcher,
# which aggregates themes/trades across multiple documents before synthesizing.

# Available Models Reference
# ==========================
# Use these model IDs in the configuration above.

available_models:
    anthropic:
        # Opus - Most capable, best for complex reasoning
        - id: claude-opus-4-5-20251101
          description: "Most capable, deep reasoning, highest quality"
          supports_thinking: true
          max_output_tokens: 32000

        # Sonnet - Balanced performance and speed
        - id: claude-sonnet-4-20250514
          description: "Balanced capability and speed"
          supports_thinking: true
          max_output_tokens: 64000

        # Haiku - Fast and efficient
        - id: claude-3-5-haiku-20241022
          description: "Fast, efficient, good for simple tasks"
          supports_thinking: false
          max_output_tokens: 8192

    openai:
        # GPT-5.2 - Next-gen model
        - id: gpt-5.2
          description: "Next-gen GPT model"
          supports_reasoning: true
          max_output_tokens: 32000

        # GPT-4o - Most capable general model
        - id: gpt-4o
          description: "Most capable GPT model"
          supports_reasoning: false
