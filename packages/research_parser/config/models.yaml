# Example Configurations
# ======================
# Copy these to the extraction section above to try different setups.

examples:
    # All OpenAI setup
    openai_full:
        boilerplate:
            provider: openai
            model: gpt-4o-mini
            max_tokens: 8192
            temperature: 0
        metadata:
            provider: openai
            model: gpt-4o-mini
            max_tokens: 4096
            temperature: 0
        themes:
            provider: openai
            model: o1
            max_tokens: 16000
            reasoning_effort: high
            # Reasoning is explicit here because theme extraction is the only step
            # that benefits from multi-pass analysis.
        trades:
            provider: openai
            model: gpt-4o
            max_tokens: 4096
            temperature: 0

    # Hybrid: OpenAI for fast tasks, Anthropic for reasoning
    hybrid:
        boilerplate:
            provider: openai
            model: gpt-4o-mini
            max_tokens: 8192
            temperature: 0
        metadata:
            provider: openai
            model: gpt-4o-mini
            max_tokens: 4096
            temperature: 0
        themes:
            provider: anthropic
            model: claude-sonnet-4-20250514
            max_tokens: 16000
            extended_thinking:
                enabled: true
                budget_tokens: 8000
        trades:
            provider: openai
            model: gpt-4o
            max_tokens: 4096
            temperature: 0

    # Cost-focused profile using Groq
    groq_budget:
        boilerplate:
            provider: groq
            model: openai/gpt-oss-20b
            max_tokens: 4096
            temperature: 0
        metadata:
            provider: groq
            model: openai/gpt-oss-20b
            max_tokens: 2048
            temperature: 0
        themes:
            provider: groq
            model: openai/gpt-oss-120b
            max_tokens: 8192
            temperature: 0
        trades:
            provider: groq
            model: openai/gpt-oss-120b
            max_tokens: 4096
            temperature: 0

    # Cost-focused profile with DeepInfra fallback for resilience
    groq_with_deepinfra_fallback:
        boilerplate:
            provider: groq
            model: openai/gpt-oss-20b
            max_tokens: 4096
            temperature: 0
            fallback:
                - provider: deepinfra
                  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
                  max_tokens: 4096
                  temperature: 0
        metadata:
            provider: groq
            model: openai/gpt-oss-20b
            max_tokens: 2048
            temperature: 0
            fallback:
                - provider: deepinfra
                  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
                  max_tokens: 2048
                  temperature: 0
        themes:
            provider: groq
            model: openai/gpt-oss-120b
            max_tokens: 8192
            temperature: 0
            fallback:
                - provider: deepinfra
                  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
                  max_tokens: 8192
                  temperature: 0
        trades:
            provider: groq
            model: openai/gpt-oss-120b
            max_tokens: 4096
            temperature: 0
            fallback:
                - provider: deepinfra
                  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
                  max_tokens: 4096
                  temperature: 0

    # OpenRouter-first profile with provider fallbacks for model swapping
    openrouter_with_fallback:
        boilerplate:
            provider: openrouter
            model: openai/gpt-5-mini
            max_tokens: 4096
            temperature: 0
            fallback:
                - provider: deepinfra
                  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
                  max_tokens: 4096
                  temperature: 0
        metadata:
            provider: openrouter
            model: openai/gpt-5-mini
            max_tokens: 2048
            temperature: 0
            fallback:
                - provider: deepinfra
                  model: meta-llama/Llama-3.3-70B-Instruct-Turbo
                  max_tokens: 2048
                  temperature: 0
        themes:
            provider: openrouter
            model: openai/gpt-5.2
            max_tokens: 8192
            temperature: 0
            reasoning_effort: high
            fallback:
                - provider: deepinfra
                  model: moonshotai/Kimi-K2-Instruct-0905
                  max_tokens: 8192
                  temperature: 0
        trades:
            provider: openrouter
            model: openai/gpt-5-mini
            max_tokens: 4096
            temperature: 0
            fallback:
                - provider: groq
                  model: openai/gpt-oss-120b
                  max_tokens: 4096
                  temperature: 0
