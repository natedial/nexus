          supports_reasoning: false
          max_output_tokens: 16384
        - id: openai/gpt-oss-120b
          description: "Higher quality open model on Groq"
          supports_reasoning: false
          max_output_tokens: 16384
        - id: qwen/qwen3-32b
          description: "Qwen 3 32B served on Groq"
          supports_reasoning: false
          max_output_tokens: 16384

    deepinfra:
        - id: meta-llama/Llama-3.3-70B-Instruct-Turbo
          description: "General-purpose instruct model"
          supports_reasoning: false
          max_output_tokens: 8192
        - id: moonshotai/Kimi-K2-Instruct-0905
          description: "Kimi K2 Instruct 0905"
          supports_reasoning: false
          max_output_tokens: 8192
        - id: moonshotai/Kimi-K2.5
          description: "Kimi K2.5 general-purpose model"
          supports_reasoning: false
          max_output_tokens: 8192
        - id: MiniMaxAI/MiniMax-M2.5
          description: "MiniMax M2.5 general-purpose model"
          supports_reasoning: false
          max_output_tokens: 8192

    fireworks:
        - id: accounts/fireworks/models/llama-v3p3-70b-instruct
          description: "General-purpose instruct model"
          supports_reasoning: false
          max_output_tokens: 8192

    together:
        - id: meta-llama/Llama-3.3-70B-Instruct-Turbo
          description: "General-purpose instruct model"
          supports_reasoning: false
          max_output_tokens: 8192

    openrouter:
        - id: openai/gpt-oss-20b:free
          description: "OpenAI OSS 20B free model routed through OpenRouter"
          supports_reasoning: false
          max_output_tokens: 8192
        - id: minimax/minimax-m2.7
