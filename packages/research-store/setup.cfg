[metadata]
name = distill-tool
version = 0.1.0
description = Markdown distillation tool for keyword extraction and embeddings
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    sentence-transformers>=2.6.0

[options.packages.find]
include = distill_tool*

[options.entry_points]
console_scripts =
    distill = distill_tool.cli:main
    distill-search = distill_tool.search_cli:main
    distill-backfill = distill_tool.backfill_cli:main
    distill-index-supabase = distill_tool.index_supabase_cli:main
