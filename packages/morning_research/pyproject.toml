[project]
name = "morning-research"
version = "0.1.0"
description = "Daily morning-research automation: deterministic Python shell + Codex judgment core."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "google-api-python-client>=2.120",
  "google-auth>=2.28",
  "structlog>=24.1",
]

[project.optional-dependencies]
supabase = [
  "supabase>=2.4",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
morning-research = "morning_research.run_daily:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
