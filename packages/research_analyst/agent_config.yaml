# Round-based Agent Registry Configuration
# Active configuration for the multi-round debate pipeline

rounds:
  - name: specialists
    type: parallel
    agents: [thesis, contrarian, positioning]
    receives: [input]
    fail_round_on_agent_error: false
  - name: synthesis
    type: sequential
    agents: [synthesizer]
    receives: [input, specialists]

agents:
  thesis:
    prompt_path: prompts/agents/thesis.md
    model:
      primary: claude-sonnet-4-20250514
      fallback: claude-haiku-4-20250514
    output_schema: DocumentAngle
    tools: [research_search, research_corpus_info]
    max_tool_calls: 4
    timeout_seconds: 120
    retry_count: 2
    temperature: 0.4

  contrarian:
    prompt_path: prompts/agents/contrarian.md
    model:
      primary: claude-sonnet-4-20250514
      fallback: claude-haiku-4-20250514
    output_schema: DocumentAngle
    tools: [research_search]
    max_tool_calls: 6
    timeout_seconds: 120
    retry_count: 2
    temperature: 0.4

  positioning:
    prompt_path: prompts/agents/positioning.md
    model:
      primary: claude-haiku-4-20250514
      fallback: claude-haiku-4-20250514
    output_schema: DocumentAngle
    tools: []
    max_tool_calls: 0
    timeout_seconds: 60
    retry_count: 2
    temperature: 0.3

  synthesizer:
    prompt_path: prompts/agents/synthesizer.md
    model:
      primary: claude-sonnet-4-20250514
      fallback: claude-sonnet-4-20250514
    output_schema: DocumentAnalysis
    tools: []
    max_tool_calls: 0
    timeout_seconds: 180
    retry_count: 2
    temperature: 0.3
