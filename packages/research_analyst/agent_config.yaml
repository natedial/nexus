# Round-based Agent Registry Configuration
# Debate rounds are active. Legacy specialist agents remain registered for fallback
# and prompt regression coverage.

rounds:
    - name: proposal
      type: parallel
      agents: [proposer_thesis, proposer_positioning]
      receives: [input]
      output_schema: DebateRoundOutput
      writes_forum_state: true
      receives_forum_state: false
      target_selector: proposal_targets
      fail_round_on_agent_error: false

    - name: challenge
      type: parallel
      agents: [challenger]
      receives: [input]
      output_schema: DebateRoundOutput
      writes_forum_state: true
      receives_forum_state: true
      target_selector: challenge_targets
      fail_round_on_agent_error: false

    - name: rebuttal
      type: parallel
      agents: [rebuttal]
      receives: [input]
      output_schema: DebateRoundOutput
      writes_forum_state: true
      receives_forum_state: true
      target_selector: rebuttal_targets
      fail_round_on_agent_error: false

    - name: adjudication
      type: sequential
      agents: [adjudicator]
      receives: [input]
      output_schema: DebateRoundOutput
      writes_forum_state: true
      receives_forum_state: true
      target_selector: all
      fail_round_on_agent_error: false

    - name: synthesis
      type: sequential
      agents: [synthesizer]
      receives: [input]
      output_schema: DocumentAnalysis
      writes_forum_state: false
      receives_forum_state: true
      target_selector: accepted_only
      fail_round_on_agent_error: false

agents:
    thesis:
        prompt_path: prompts/agents/thesis.md
        model:
            primary: gpt-5-mini
            fallback: gpt-5-nano
        output_schema: DocumentAngle
        tools: [research_search]
        max_tool_calls: 4
        timeout_seconds: 120
        retry_count: 2
        temperature: 0.4
        priority: 10

    contrarian:
        prompt_path: prompts/agents/contrarian.md
        model:
            primary: gpt-5-mini
