[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-analysis-layer"
version = "0.1.0"
description = "Bootstrap analysis layer between research_parser and research_dispatcher."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = [
  "pydantic>=2.12.5",
  "pytest>=8,<9",
  "pyyaml>=6.0.3",
  "httpx>=0.27.0",
]

[project.scripts]
research-analysis = "research_analysis_layer.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]
