# Model Configuration for Research Dispatcher
# =============================================
# Change models on the fly by editing this file.

synthesis:
  # Cross-document synthesis - needs deep reasoning (monolithic fallback)
  # Recommended: strongest reliable JSON model for full-payload fallback
  provider: openai
  model: gpt-5-mini
  max_tokens: 16000
  temperature: 0
  response_format:
    type: json_object
  output_contract: json_object
  parse_strategy: strict_json_object
  reasoning_mode: stage_reasoning

# Skill-specific configurations (used when USE_SKILL_PIPELINE=true)
skills:
  throughline_synthesizer:
    # Stage 1 primary: GPT-5-mini with full prompt for analyst-grade depth
    provider: openai
    model: gpt-5-mini
    max_tokens: 16000
    temperature: 0
    request_timeout_seconds: 120
    max_retries: 0
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object
    reasoning_mode: stage_reasoning
    prompt_profile: full
    max_key_insight_words: 300
    max_supporting_themes: 6
    max_supporting_trades: 2

  throughline_synthesizer_fallback:
    # Stage 1 fallback: Kimi instruct (was primary, now fallback)
    provider: deepinfra
    model: moonshotai/Kimi-K2-Instruct-0905
    max_tokens: 1400
    temperature: 0
    request_timeout_seconds: 90
    max_retries: 0
    retry_backoff_seconds: 2
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object
    reasoning_mode: stage_reasoning
    drop_response_format_on_retry: false
    prompt_profile: lean
    throughline_count: 4
    max_key_insight_words: 100
    max_supporting_themes: 4
    max_supporting_trades: 1
    payload_theme_limit: 24
    payload_trade_limit: 8

  throughline_synthesizer_secondary_fallback:
    # Stage 1 secondary fallback: compact DeepInfra path if primary and OpenAI both fail
    provider: deepinfra
    model: MiniMaxAI/MiniMax-M2.5
    max_tokens: 2200
    temperature: 0
    request_timeout_seconds: 90
    max_retries: 0
    retry_backoff_seconds: 2
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object
    reasoning_mode: stage_reasoning
    drop_response_format_on_retry: true
    prompt_profile: lean
    throughline_count: 3
    max_key_insight_words: 80
    max_supporting_themes: 4
    max_supporting_trades: 1
    payload_theme_limit: 18
    payload_trade_limit: 6

  throughline_editor:
    # Stage 1B editor: required canonical editorial pass when configured
    # Rewrites stage-one output for readability and schema discipline without adding claims
    provider: openai
    model: gpt-5-mini
    max_tokens: 6000
    temperature: 0
    request_timeout_seconds: 90
    max_retries: 0
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object

  throughline_analyst:
    # Stage 1C analyst: PM-facing writeup grounded in edited through-lines and scoped theme evidence
    provider: openai
    model: gpt-5-mini
    max_tokens: 5000
    temperature: 0.3
    request_timeout_seconds: 90
    max_retries: 0
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object
    reasoning_mode: stage_reasoning

  throughline_analyst_editor:
    # Stage 1D analyst editor: tighten the PM writeup while preserving grounding and coverage
    provider: openai
    model: gpt-5-mini
    max_tokens: 4000
    temperature: 0.3
    request_timeout_seconds: 90
    max_retries: 0
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object

  callout_extractor:
    # Stage 2: Extract callouts from through-lines (lighter task)
    provider: openai
    model: gpt-5-mini
    max_tokens: 16000
    temperature: 0
    response_format:
      type: json_object
    output_contract: json_object
    parse_strategy: strict_json_object

