[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-gleaner"
version = "0.1.0"
description = "Capture source-grounded highlights for the Nexus research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "remarkable-mcp>=2.1,<3",
    "research-pipeline-ops>=0.1.0",
]

[tool.uv.sources]
research-pipeline-ops = { path = "../research_pipeline_ops", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
research-gleaner = "research_gleaner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
